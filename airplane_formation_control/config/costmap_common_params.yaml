robot_radius: 0.6
inflation_radius: 0.8
obstacle_range: 10.0
raytrace_range: 10.0


static_layer:
    enabled: true
    map_topic: /robot0/map                  # 确保与地图服务器的话题一致
inflation_layer:
    enabled: true
    cost_scaling_factor: 3.0
    inflation_radius: 0.8
obstacle_layer:
    enabled: true
    observation_sources: base_lidar
    base_lidar: {data_type: PointCloud2, topic: /robot0/points_raw, min_obstacle_height: 0.1, max_obstacle_height: 1.0, marking: true, clearing: true}